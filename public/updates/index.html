<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YYCY51HV7R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YYCY51HV7R');
  </script>
  <title>アップデート情報 — めぐる君</title>
  <meta name="description" content="めぐる君のアップデート履歴。バージョンごとの変更点をまとめています。">
  <link rel="canonical" href="https://ict-round.conect.llc/updates">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .gradient-hero { background: linear-gradient(135deg, #0f4c81 0%, #1a73c8 50%, #0ea5e9 100%); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <section class="gradient-hero text-white py-12 px-6 text-center">
    <h1 class="text-2xl font-black mb-2">アップデート情報</h1>
    <p class="text-blue-200 text-sm">めぐる君のバージョンごとの変更点をまとめています</p>
  </section>

  <section class="py-12 px-6 max-w-2xl mx-auto">
    <div id="release-list" class="flex flex-col gap-6"></div>
    <p class="text-center mt-10">
      <a href="../about/" class="text-blue-600 font-bold hover:underline">← めぐる君の紹介ページに戻る</a>
    </p>
  </section>

  <script>
    const escapeHTML = (str) => str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);

    fetch('/updates/releases.json')
      .then((res) => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then((releases) => {
        const list = document.getElementById('release-list');
        list.innerHTML = releases.map((release) => `
          <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
            <div class="flex items-center gap-3 mb-3">
              <span class="badge bg-blue-50 text-blue-700 border border-blue-200">v${escapeHTML(release.version)}</span>
              <span class="text-gray-400 text-xs">${escapeHTML(release.date)}</span>
            </div>
            <ul class="list-disc list-inside text-sm text-gray-700 flex flex-col gap-1">
              ${release.changes.map((change) => `<li>${escapeHTML(change)}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      })
      .catch((error) => {
        console.error('Failed to load releases:', error);
        document.getElementById('release-list').innerHTML = '<p class="text-gray-500">アップデート情報の読み込みに失敗しました。</p>';
      });
  </script>

</body>
</html>
