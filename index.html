<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aokikun-icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E76F51" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="あおき君" />
    <meta name="description" content="あおき君は院内感染ラウンドをチェックリスト、写真、総評、Word報告書で支援する端末内保存の試作Webアプリです。" />
    <meta property="og:title" content="あおき君 — 院内感染ラウンド支援アプリ" />
    <meta property="og:description" content="院内感染ラウンドを、もっとやさしく、たのしく。" />
    <meta property="og:site_name" content="あおき君" />
    <title>あおき君</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(
          location.hostname
        );
        // 開発時(localhost)はSWを登録しない。過去に登録された古いSWが残っていると
        // 別プロジェクト/別ポートと混線するため、既存の登録があれば自己解除する。
        if (isLocalhost) {
          navigator.serviceWorker
            .getRegistrations()
            .then((regs) => regs.forEach((reg) => reg.unregister()));
        } else {
          window.addEventListener('load', () => {
            let isReloading = false;
            const reloadPage = () => {
              if (isReloading) return;
              isReloading = true;
              window.location.reload();
            };

            navigator.serviceWorker
              .register('./sw.js')
              .then((registration) => {
                registration.onupdatefound = () => {
                  const newWorker = registration.installing;
                  if (!newWorker) return;

                  newWorker.addEventListener('statechange', () => {
                    if (
                      newWorker.state === 'installed' &&
                      navigator.serviceWorker.controller
                    ) {
                      reloadPage();
                    }
                  });
                };
              });

            navigator.serviceWorker.addEventListener('controllerchange', () => {
              reloadPage();
            });
          });
        }
      }
    </script>
  </body>
</html>
